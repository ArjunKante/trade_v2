name: Fibo morning job

# LIVE since 2026-10-16 -- see OPERATIONS.md's "The morning job is moving
# to GitHub Actions" section for the three prerequisite fixes that had to
# land first, and for why this must be the ONLY place
# scripts/fibo_morning.py ever runs from here on (never also the laptop).
#
# NO schedule: trigger here, deliberately -- GitHub's own cron evaluator
# fired this job 3-7+ hours late, every day, 2026-10-19 through
# 2026-10-22 (see OPERATIONS.md's "GitHub Actions schedule fires hours
# late" and "External pinger" sections for the evidence and the
# decision). Triggering is now owned entirely by an external scheduler
# (cron-job.org) calling this workflow's dispatch endpoint 4x/trading day
# -- see OPERATIONS.md for the exact schedule, the heartbeat/dead-man's-
# switch that watches for the pinger itself going silent, and the ONE
# OWNER reasoning for why re-adding schedule: here would reintroduce the
# exact double-trigger risk this file's own comments already warn about
# elsewhere. workflow_dispatch stays so both cron-job.org and a human can
# trigger this manually.
on:
  workflow_dispatch:

# This job commits and pushes events.jsonl itself (fibo_live/
# git_sync.py), the same as the laptop's evening job does -- needs write
# access to repo contents via the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  run:
    # Pinned, not ubuntu-latest: GitHub's own notice says ubuntu-latest
    # migrates from 24.04 to Ubuntu 26 on 2026-10-19 -- the same day this
    # schedule's first fully automatic Monday morning runs. Letting
    # "latest" silently change the runner image under a scheduled job on
    # exactly that day is an avoidable, unrelated variable; pin explicitly
    # and bump deliberately later instead.
    runs-on: ubuntu-24.04
    # TZ is a SECOND safeguard only -- scripts/fibo_morning.py and its
    # dependencies compute IST explicitly in code (dt.datetime.now(IST)),
    # so correctness does not depend on this. Set anyway so any stray
    # naive datetime call -- in a dependency, or a future change that
    # regresses the explicit-IST fix -- fails the same way it would on
    # the laptop instead of silently reading UTC.
    env:
      TZ: Asia/Kolkata
    steps:
      # Dead-man's-switch heartbeat (healthchecks.io) -- FIRST step,
      # before checkout, so it fires even if every later step fails.
      # This answers a DIFFERENT question than the rest of the job: not
      # "did the trading logic succeed" but "did a run happen at all
      # today." That second question has no other durable signal once
      # the schedule: trigger is gone (see OPERATIONS.md's "External
      # pinger" section) -- if cron-job.org stops firing, or GitHub
      # Actions itself is down, NOTHING runs, so nothing gets committed
      # to events.jsonl either; this ping is the one thing that can still
      # go missing and be independently noticed, because healthchecks.io
      # alerts on an ABSENT ping, not a present one. continue-on-error:
      # a flaky/unreachable monitoring endpoint must never block the
      # actual job from running. `set +e` inside the script (rather than
      # a trailing `|| true`) so the diagnostic echo lines below still
      # run even when curl fails -- the first version of this step used
      # `|| true` and swallowed a real failure (empty secret or a bad
      # URL) with zero trace in the log, which is exactly the "silent
      # failure" this whole mechanism exists to avoid. Never echoes the
      # secret's VALUE (GitHub masks exact secret-string matches in logs
      # anyway, but this doesn't rely on that) -- only whether it's set
      # and how long it is, which is enough to tell "secret empty" apart
      # from "secret present but curl/healthchecks.io failed."
      - name: Heartbeat ping (healthchecks.io)
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          set +e
          if [ -z "$HC_URL" ]; then
            echo "HEALTHCHECKS_PING_URL secret is EMPTY or not set -- no heartbeat was sent."
          else
            echo "HEALTHCHECKS_PING_URL secret is present (${#HC_URL} characters)."
            http_code=$(curl -fsS -m 10 --retry 3 -o /dev/null -w '%{http_code}' "$HC_URL")
            curl_exit=$?
            echo "curl exit code: $curl_exit, HTTP status: ${http_code:-none}"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity for the push this job makes
        run: |
          git config user.name "fibo-morning-job[bot]"
          git config user.email "fibo-morning-job@users.noreply.github.com"

      # Credentials come ONLY from GitHub Secrets. Nothing here echoes
      # them or dumps `env`; fibo.auth._redact and send_email's fail-soft
      # exception handling are the real safety net (see
      # scripts/probe_github_actions.py and src/fibo/auth.py).
      - name: Run the morning job
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          FIBO_EMAIL_FROM: ${{ secrets.FIBO_EMAIL_FROM }}
          FIBO_EMAIL_APP_PASSWORD: ${{ secrets.FIBO_EMAIL_APP_PASSWORD }}
          FIBO_EMAIL_TO: ${{ secrets.FIBO_EMAIL_TO }}
        run: python scripts/fibo_morning.py
